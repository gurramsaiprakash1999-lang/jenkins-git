<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Technology Hub</title>
  <style>
    /* Reset & Theme Variables */
    :root {
      --bg-dark: #070b14;
      --bg-panel: #0f172a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --accent-hover: #059669;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navigation Bar */
    .navbar {
      background-color: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .btn-nav {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent) !important;
      padding: 7px 16px;
      border-radius: 5px;
      transition: all 0.2s !important;
    }

    .btn-nav:hover {
      background-color: var(--accent);
      color: var(--bg-dark) !important;
    }

    /* Hero Section */
    .hero {
      padding: 100px 0 80px;
      text-align: center;
      background: radial-gradient(circle at top, #0f2922 0%, var(--bg-dark) 65%);
      border-bottom: 1px solid var(--border-color);
    }

    .status-badge {
      display: inline-block;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: monospace;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto 32px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary, .btn-secondary {
      padding: 12px 26px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--bg-dark);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: var(--text-main);
    }

    .btn-secondary {
      border: 1px solid var(--border-color);
      background-color: var(--bg-panel);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Capabilities Grid */
    .capabilities {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 28px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card .icon {
      font-size: 1.8rem;
      margin-bottom: 14px;
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95
